[package]
name = "tapors"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Pure Rust implementation for Tapo camera communication"
license = "MIT"
repository = "https://github.com/yourusername/tapors"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
md5 = "0.7"
rand = "0.8"
base64 = "0.22"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
hex = "0.4"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
